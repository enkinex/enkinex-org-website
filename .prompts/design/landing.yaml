task: Create a minimal landing page for Enkinex according to the `specs`
specs:
  framework: React 19
  ui: Use the attached `mantine-llm-docs.txt` to learn how to use and customize Mantine UI components
  typography:
    - The brand font uses the Google Font `Homenage` vectorized to the shape `enkinex`
    - Search on Google Fonts or another free fonts to create a professional typography for the brand font and style
    - Do a deep research on typography to find the best balance on readability and the brand concept
  icons:
    - You can search for a modern free icon set at `https://icon-sets.iconify.design/` that fits with the brand.
    - I was using lucid and tabler in my first drafts but I don't know if they are good for this new logo and typography
  theme:
    - We are going to test my favorite theme to use as a baseline and later try other variations after refining this one
    - Use the dark theme from our previous Enkinex Logo Analysis
    - Start clean with the symbol with white wedges and teal center body exactly like in the section `02. Anatomy of the Mark`
    - Start clean with the name `enkinex` in white and later decide if we are going to use a second color
    - Use gold as the accent color
  content:
    navbar:
      info: Use a Mantine responsive horizontal navbar that collapses to a menu icon with a vertical menu on mobile devices
      items:
        - Home
        - Components
        - Docs
        - GitHub (Button with Icon)
    hero:
      caption: Enkinex Data & AI Framework
      diagram:
        desired: Make this hero memorable and appealing as a state of the art professional graph designer
        concept:
          - I'm going to create a custom diagram with `reactflow` that represents the framework concept
          - There are three nodes representing the three pillars [Semantic Driven Design] [Contract Driven Lifecycle] [Composable Mesh Architecture]
          - There is a central node that represents the convergence between them [Enkinex API]
          - The diagram can have original shapes using the same idea we used in the logo with 3 wedges and a central connection flow
          - We don't need to use the exact same shape but maybe we can use shapes inspired in the brand concept that compose well with the brand symbol but preserves the software architecture nature of the concept
        nodes:
          - Semantic Driven Design (Gold; Top)
          - Composable Mesh Architecture (Blue; Left)
          - Contract Driven Lifecycle (Teal; Right)
          - Enkinex API (Teal; Center)
        headline: Three foundational pillars that converge at the Enkinex API to establish a semantic driven platform.
    footer:
      social:
        - GitHub
        - LinkedIn
      copyright: Copyright 2026 Enkinex Data Ltda
